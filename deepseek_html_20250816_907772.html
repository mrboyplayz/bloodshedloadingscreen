<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>cro's homigrad | Loading...</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Oswald', sans-serif;
      color: #f2f2f2;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
    }

    /* Background slideshow */
    .slideshow {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    .slide {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 2s ease-in-out;
    }
    .slide.active { opacity: 1; }

    h1 {
      font-size: 60px;
      margin: 10px 0;
      z-index: 2;
    }
    h2 {
      font-size: 20px;
      margin-bottom: 20px;
      z-index: 2;
    }

    .spinner {
      border: 8px solid rgba(255,255,255,0.2);
      border-top: 8px solid #e50914;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
      z-index: 2;
    }
    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }

    .status {
      font-size: 18px;
      margin-top: 10px;
      z-index: 2;
      color: #ffcccc;
    }

    .tips {
      position: absolute;
      bottom: 50px;
      font-size: 18px;
      z-index: 2;
      color: #f0f0f0;
      text-align: center;
      width: 100%;
      animation: fadein 1s ease-in-out;
    }

    @keyframes fadein {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    footer {
      position: absolute;
      bottom: 15px;
      font-size: 14px;
      color: #ddd;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="slideshow">
    <div class="slide active" style="background-image: url('https://i.imgur.com/6Z7h2dR.jpeg');"></div>
    <div class="slide" style="background-image: url('https://i.imgur.com/u6sYBBe.jpeg');"></div>
    <div class="slide" style="background-image: url('https://i.imgur.com/v2Ej0ZJ.jpeg');"></div>
    <div class="slide" style="background-image: url('https://i.imgur.com/tmYZJ6L.jpeg');"></div>
  </div>

  <h1>Bloodshed Redux</h1>
  <h2>Loading... Please wait.</h2>
  <div class="spinner"></div>
  <div class="status" id="statusText">(Preparing downloads...)</div>

  <div class="tips" id="tipBox">Please download our collection in the discord, https://discord.gg/JHZVVyFrWh</div>

  <footer>welcome to cro's bloodshed, peak bloodshed.</footer>

  <script>
    // --- Background Slideshow ---
    const slides = document.querySelectorAll(".slide");
    let current = 0;
    setInterval(() => {
      slides[current].classList.remove("active");
      current = (current + 1) % slides.length;
      slides[current].classList.add("active");
    }, 7000);

    // --- Download status display ---
    function getQueryParams() {
      const params = {};
      window.location.search.substring(1).split("&").forEach(pair => {
        const [key, value] = pair.split("=");
        if (key) params[decodeURIComponent(key)] = decodeURIComponent(value || "");
      });
      return params;
    }

    const params = getQueryParams();
    const statusText = document.getElementById("statusText");

    if (params.dlfile) {
      statusText.textContent = "Downloading: " + params.dlfile;
    } else if (params.mapname) {
      statusText.textContent = "Loading map: " + params.mapname;
    } else {
      statusText.textContent = "(Preparing content...)";
    }

    // --- Rotating Tips ---
    const tips = [
      "Tip: Respect the rules and don’t RDM.",
      "Tip: Press C to open the context menu.",
      "Tip: Use voice chat to coordinate with your team.",
      "Tip: Follow staff instructions to avoid bans.",
      "Tip: Hold TAB to check the scoreboard."
    ];

    let tipIndex = 0;
    const tipBox = document.getElementById("tipBox");

    setInterval(() => {
      tipIndex = (tipIndex + 1) % tips.length;
      tipBox.textContent = tips[tipIndex];
    }, 6000);
  </script>
</body>
</html>
