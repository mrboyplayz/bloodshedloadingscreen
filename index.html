<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>cro's homigrad | Loading...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body, html {
  height: 100%; width: 100%;
  overflow: hidden;
  font-family: 'Oswald', Arial, sans-serif;
  color: #f2f2f2;
  text-shadow: 0 0 8px rgba(0,0,0,0.8);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  position: relative;
  background: #222;
}
.slideshow {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: -1; overflow: hidden;
}
.slide {
  position: absolute; top: 0; left: 0;
  width: 100vw; height: 100vh;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 1.5s ease-in-out;
}
.slide.active { opacity: 1; }

h1 { font-size: 60px; margin: 10px 0; z-index: 2; text-align: center; }
h2 { font-size: 22px; margin-bottom: 16px; z-index: 2; text-align: center;}

.status {
  font-size: 20px;
  margin-top: 10px;
  z-index: 2;
  color: #ff7878;
  text-align: center;
}
.tips {
  position: absolute; bottom: 60px;
  font-size: 18px;
  z-index: 2;
  color: #6cff78;
  text-align: center;
  width: 100%;
  animation: fadein 1s ease-in-out;
}
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
footer {
  position: absolute; bottom: 18px;
  font-size: 14px; color: #6cff78;
  z-index: 2; width: 100%; text-align: center;
}
.spinner {
  margin: 24px auto 0 auto;
  width: 60px; height: 60px;
  border: 7px solid #6cff78;
  border-top: 7px solid #ff7878;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  z-index:2;
}
@keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}
</style>
</head>
<body>

<div class="slideshow">
  <div class="slide active" style="background-image: url('https://files.catbox.moe/j4f3uq.png');"></div>
  <div class="slide" style="background-image: url('https://files.catbox.moe/una6xn.png');"></div>
  <div class="slide" style="background-image: url('https://files.catbox.moe/6cwk58.png');"></div>
  <div class="slide" style="background-image: url('https://files.catbox.moe/r9a856.png');"></div>
  <div class="slide" style="background-image: url('https://files.catbox.moe/g700pk.png');"></div>
  <div class="slide" style="background-image: url('https://files.catbox.moe/yonumg.png');"></div>
  <div class="slide" style="background-image: url('https://files.catbox.moe/l80axg.png');"></div>
  <div class="slide" style="background-image: url('https://files.catbox.moe/5mudn6.gif');"></div>
  <div class="slide" style="background-image: url('https://files.catbox.moe/cr64dw.jpg');"></div>
</div>

<h1>crow's homigrad<br><span style="font-size:24px;">We host Bloodshed every Friday!</span></h1>
<h2>Loading... Please wait.</h2>
<div class="spinner"></div>
<div class="status" id="statusText">(Preparing downloads...)</div>
<div class="tips" id="tipBox">Please download our collection in the discord, https://discord.gg/JHZVVyFrWh</div>
<footer>welcome to crow's homigrad, peak homigrad.</footer>

<script>
// Simple slideshow
const slides = document.querySelectorAll(".slide");
let current = 0;
setInterval(() => {
  slides[current].classList.remove("active");
  current = (current + 1) % slides.length;
  slides[current].classList.add("active");
}, 7000);

// Status text updater (support for Garry's Mod query params)
function getQueryParams() {
  const params = {};
  window.location.search.substring(1).split("&").forEach(pair => {
    const [key, value] = pair.split("=");
    if (key) params[decodeURIComponent(key)] = decodeURIComponent(value || "");
  });
  return params;
}
const params = getQueryParams();
const statusText = document.getElementById("statusText");
if (params.dlfile) {
  statusText.textContent = "Downloading: " + params.dlfile;
} else if (params.mapname) {
  statusText.textContent = "Loading map: " + params.mapname;
} else {
  statusText.textContent = "(Preparing content...)";
}

// Tip cycling
const tips = [
  "We don't talk about the chicken jockey swep.",
  "Hold Q to access the menu for everything you need.",
  "Press F2 to open a shop, where you buy guns, melees, etc.",
  "Do you goon everyday? Do you scare huzz away? Do you smell like fish fillet?",
  "If you had any memories from me in 2023 to late 2024, It wasn't me.",
  "I dream about Cheeese.",
  "Join our discord! https://discord.gg/4sfJ5KtTaX",
];
let tipIndex = 0;
const tipBox = document.getElementById("tipBox");
setInterval(() => {
  tipIndex = (tipIndex + 1) % tips.length;
  tipBox.textContent = tips[tipIndex];
}, 6000);
</script>
</body>
</html>
