<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>cro's homigrad | Loading...</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body, html {
  height: 100%; width: 100%;
  overflow: hidden;
  font-family: 'Oswald', sans-serif;
  color: #f2f2f2;
  text-shadow: 0 0 8px rgba(0,0,0,0.8);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  position: relative;
}
.slideshow {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: -1; overflow: hidden;
}
.slide {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 2s ease-in-out;
}
.slide.active { opacity: 1; }

h1 { font-size: 60px; margin: 10px 0; z-index: 2; }
h2 { font-size: 20px; margin-bottom: 20px; z-index: 2; }

.spinner {
  width: 64px;
  height: 64px;
  background: url('https://files.catbox.moe/7odss3.gif') center center no-repeat;
  background-size: contain;
  margin-bottom: 20px;
  z-index: 2;
}

.status {
  font-size: 18px;
  margin-top: 10px;
  z-index: 2;
  color: #ff7878;
}
.tips {
  position: absolute; bottom: 50px;
  font-size: 18px;
  z-index: 2;
  color: #6cff78;
  text-align: center;
  width: 100%;
  animation: fadein 1s ease-in-out;
}
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
footer {
  position: absolute; bottom: 15px;
  font-size: 14px; color: #6cff78;
  z-index: 2;
}
</style>
</head>
<body>

<div class="slideshow">
  <div class="slide active" style="background-image: url('https://files.catbox.moe/j4f3uq.png');"></div>
  <div class="slide" style="background-image: url('https://files.catbox.moe/una6xn.png');"></div>
  <div class="slide" style="background-image: url('https://files.catbox.moe/6cwk58.png');"></div>
  <div class="slide" style="background-image: url('https://files.catbox.moe/r9a856.png');"></div>
  <div class="slide" style="background-image: url('https://files.catbox.moe/g700pk.png');"></div>
  <div class="slide" style="background-image: url('https://files.catbox.moe/yonumg.png');"></div>
</div>

<style>
body::after {
  content: url('https://files.catbox.moe/j4f3uq.png')
           url('https://files.catbox.moe/una6xn.png')
           url('https://files.catbox.moe/6cwk58.png')
           url('https://files.catbox.moe/r9a856.png')
           url('https://files.catbox.moe/g700pk.png')
           url('https://files.catbox.moe/yonumg.png');
  display: none;
}
</style>


<h1>cro's bloodshed [We host Harrison's every Friday!]</h1>
<h2>Loading... Please wait.</h2>
<div class="spinner"></div>
<div class="status" id="statusText">(Preparing downloads...)</div>
<div class="tips" id="tipBox">Please download our collection in the discord, https://discord.gg/JHZVVyFrWh</div>
<footer>welcome to cro's bloodshed, peak bloodshed.</footer>

<script>
const slides = document.querySelectorAll(".slide");
let current = 0;
setInterval(() => {
  slides[current].classList.remove("active");
  current = (current + 1) % slides.length;
  slides[current].classList.add("active");
}, 7000);

function getQueryParams() {
  const params = {};
  window.location.search.substring(1).split("&").forEach(pair => {
    const [key, value] = pair.split("=");
    if (key) params[decodeURIComponent(key)] = decodeURIComponent(value || "");
  });
  return params;
}
const params = getQueryParams();
const statusText = document.getElementById("statusText");
if (params.dlfile) {
  statusText.textContent = "Downloading: " + params.dlfile;
} else if (params.mapname) {
  statusText.textContent = "Loading map: " + params.mapname;
} else {
  statusText.textContent = "(Preparing content...)";
}

const tips = [
  "We don't talk about the chicken jockey swep.",
  "Hold Q inorder to access the menu for everything you need.",
  "Press F2 to open a shop, where you buy guns, melees, etc,",
  "Do you goon everyday? Do you scare huzz away? Do you smell like fish fillet?",
  "If you had any memories from me in 2023 to late 2024, It wasn't me",
  "I dream about Cheeese.",
];
let tipIndex = 0;
const tipBox = document.getElementById("tipBox");
setInterval(() => {
  tipIndex = (tipIndex + 1) % tips.length;
  tipBox.textContent = tips[tipIndex];
}, 6000);
</script>

</body>
</html>
